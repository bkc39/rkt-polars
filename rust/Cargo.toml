[package]
name = "compat"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dev-dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
polars-core = { git = "https://github.com/bkc39/polars", rev = "765237c44fca71a0656b546fe955759f9f7f97dc", default-features = false }
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
zstd = "0.13.2"

[dependencies]
# polars 0.55 hashes with blake3; "pure" leaves out its C and assembly, whose
# symbols leak into the macOS dylib's exports.
blake3 = { version = "1.8.7", features = ["pure"] }
chrono = "0.4.38"
polars = { git = "https://github.com/bkc39/polars", rev = "765237c44fca71a0656b546fe955759f9f7f97dc", features = ["lazy", "parquet", "json", "ipc", "ipc_streaming", "avro", "scan_lines", "decompress", "http", "aws", "gcp", "azure", "cross_join", "semi_anti_join", "asof_join", "pivot", "strings", "regex", "temporal", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16", "abs", "round_series", "sign", "log", "is_in", "is_unique", "is_first_distinct", "is_last_distinct", "is_between", "cum_agg", "diff", "rank", "meta", "dtype-categorical", "dtype-decimal", "timezones", "nightly"] }
polars-async = { git = "https://github.com/bkc39/polars", rev = "765237c44fca71a0656b546fe955759f9f7f97dc", default-features = false }
polars-buffer = { git = "https://github.com/bkc39/polars", rev = "765237c44fca71a0656b546fe955759f9f7f97dc", default-features = false }
rayon = "1.10.0"
serde_json = "1.0.122"
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[profile.release]
strip = "symbols"
# guard_panic catches polars panics, so panics must unwind.
panic = "unwind"

# The committed candidates (scripts/build-so.sh), sized for GitHub's 100 MiB
# file limit (#125, #216); nix and cargo test stay on release, where LTO would
# link every test and example binary on one core.  The Linux build takes fat
# LTO on top (scripts/build-so.sh), whose 7 GiB peak a 7 GB macOS runner lacks.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

# The crates only the cloud sources reach (object_store's HTTP and TLS stack),
# built for size: a request's cost is the network's.
[profile.dist.package]
form_urlencoded = { opt-level = "s" }
h2 = { opt-level = "s" }
http = { opt-level = "s" }
http-body = { opt-level = "s" }
http-body-util = { opt-level = "s" }
httparse = { opt-level = "s" }
hyper = { opt-level = "s" }
hyper-rustls = { opt-level = "s" }
hyper-util = { opt-level = "s" }
icu_collections = { opt-level = "s" }
icu_locale_core = { opt-level = "s" }
icu_normalizer = { opt-level = "s" }
icu_normalizer_data = { opt-level = "s" }
icu_properties = { opt-level = "s" }
icu_properties_data = { opt-level = "s" }
icu_provider = { opt-level = "s" }
idna = { opt-level = "s" }
idna_adapter = { opt-level = "s" }
ipnet = { opt-level = "s" }
litemap = { opt-level = "s" }
md-5 = { opt-level = "s" }
object_store = { opt-level = "s" }
potential_utf = { opt-level = "s" }
quick-xml = { opt-level = "s" }
reqwest = { opt-level = "s" }
ring = { opt-level = "s" }
rustls = { opt-level = "s" }
rustls-native-certs = { opt-level = "s" }
rustls-pki-types = { opt-level = "s" }
rustls-webpki = { opt-level = "s" }
serde_urlencoded = { opt-level = "s" }
sync_wrapper = { opt-level = "s" }
tinystr = { opt-level = "s" }
tokio-rustls = { opt-level = "s" }
tower = { opt-level = "s" }
tower-http = { opt-level = "s" }
tower-layer = { opt-level = "s" }
tower-service = { opt-level = "s" }
try-lock = { opt-level = "s" }
untrusted = { opt-level = "s" }
url = { opt-level = "s" }
want = { opt-level = "s" }
writeable = { opt-level = "s" }
yoke = { opt-level = "s" }
zerofrom = { opt-level = "s" }
zerotrie = { opt-level = "s" }
zerovec = { opt-level = "s" }

