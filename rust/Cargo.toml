[package]
name = "compat"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dev-dependencies]
tempfile = "3"

[dependencies]
# polars 0.55 hashes with blake3; "pure" leaves out its C and assembly, whose
# symbols leak into the macOS dylib's exports.
blake3 = { version = "1.8.7", features = ["pure"] }
chrono = "0.4.38"
polars = { version = "0.55.2", features = ["lazy", "parquet", "json", "ipc", "ipc_streaming", "avro", "scan_lines", "decompress", "http", "aws", "gcp", "azure", "cross_join", "semi_anti_join", "asof_join", "pivot", "strings", "regex", "temporal", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16", "abs", "round_series", "sign", "log", "is_in", "is_unique", "is_first_distinct", "is_last_distinct", "is_between", "cum_agg", "diff", "rank", "meta", "dtype-categorical", "dtype-decimal", "nightly"] }

[profile.release]
strip = "symbols"
# guard_panic catches polars panics, so panics must unwind.
panic = "unwind"

# The committed candidates (scripts/build-so.sh). Thin LTO keeps the Linux one
# under GitHub's 100 MiB file limit (#125); nix and cargo test stay on release,
# where LTO would link every test and example binary on one core.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
