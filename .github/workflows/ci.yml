# One run per commit: a PR commit runs only as pull_request (the merge with
# its base), which is the run scripts/refresh-candidates.sh reads.  A branch
# without a PR runs on demand (`gh workflow run ci.yml --ref <branch>`).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
name: CI

# Cancel superseded runs for the same ref so rapid re-pushes don't pile up.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# CI runs both reusable workflows; the workflow (and its badge) is green only
# when both the native and nix checks pass.
jobs:
  native:
    uses: ./.github/workflows/native.yml

  nix:
    uses: ./.github/workflows/nix.yml
