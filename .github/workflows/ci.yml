# One run per commit: a PR commit runs only as pull_request (the merge with
# its base).  A branch without a PR runs on demand (`gh workflow run ci.yml
# --ref <branch>`).  release.yml builds and installs the native packages.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
name: CI

# Cancel superseded runs for the same ref so rapid re-pushes don't pile up.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    uses: ./.github/workflows/nix.yml
