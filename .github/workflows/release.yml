name: Release build

on:
  pull_request:
    paths:
      - rust/**
      - scripts/build-so.sh
      - scripts/test-build-so.sh
      - native/**
      - polars/info.rkt
      - polars/private/native-*.rkt
      - polars/private/install-compat.rkt
      - polars/private/resource.rkt
      - scripts/release/**
      - scripts/stage-native-package.rkt
      - scripts/check-bindings.rkt
      - scripts/check-native-install.rkt
      - scripts/dependency-catalogs.sh
      - scripts/docs-check.sh
      - flake.nix
      - flake.lock
      - .github/actions/install-racket/**
      - .github/workflows/release.yml
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A PR's head, not the merge with its base, so the manifest's commit is one
# that exists after the run.
env:
  CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: The native release a tag drafts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      racket: ${{ steps.racket.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - id: racket
        name: The Racket release scripts/release/pins.sh pins
        run: |
          . scripts/release/pins.sh
          echo "version=$RELEASE_RACKET_VERSION" >>"$GITHUB_OUTPUT"
      - uses: ./.github/actions/install-racket
        with:
          version: ${{ steps.racket.outputs.version }}
          architecture: x64
      - id: plan
        name: Draft only for v<native-version>
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/release/draft-tag.sh "$TAG" >>"$GITHUB_OUTPUT"

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: cargo-about, at flake.lock's nixpkgs
        run: scripts/release/notices.sh "$RUNNER_TEMP/notices/THIRD-PARTY-NOTICES.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: ${{ runner.temp }}/notices
          if-no-files-found: error

  build:
    name: Build libcompat (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: x86_64-linux
            target: linux
          - os: macos-latest
            platform: aarch64-macosx
            target: darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      # Under the bash 3.2 macOS ships, which the flake check does not run.
      - name: Stub test of build-so.sh under /bin/bash
        if: matrix.target == 'darwin'
        run: |
          /bin/bash -c 'echo "/bin/bash is $BASH_VERSION"; ((BASH_VERSINFO[0] == 3))'
          BASH_UNDER_TEST=/bin/bash bash scripts/test-build-so.sh
      - name: Cache cargo build
        if: matrix.target == 'darwin'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build shared object
        run: scripts/build-so.sh ${{ matrix.target }}
      - name: Record the rust/ tree and commit built
        run: |
          git rev-parse HEAD:rust > rust/target/libcompat/${{ matrix.target }}/rust-tree
          git rev-parse HEAD > rust/target/libcompat/${{ matrix.target }}/commit
      - uses: actions/upload-artifact@v7
        with:
          name: libcompat-${{ matrix.platform }}
          path: rust/target/libcompat/${{ matrix.target }}/
          if-no-files-found: error

  # The glibc gate reads symbol versions; this loads the library under 2.17,
  # in the image build-so.sh recorded.  Runner agents cannot run in that
  # image, so docker drives it.
  old-glibc-load:
    name: dlopen libcompat.so under glibc 2.17
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: libcompat-x86_64-linux
          path: lib
      - name: dlopen in the build image
        run: |
          set -euo pipefail
          image=$(sed -n 's/^image: //p' lib/toolchain)
          if [ -z "$image" ]; then
            echo "error: lib/toolchain names no build image" >&2
            exit 1
          fi
          docker run --rm -v "$PWD/lib:/lib-in:ro" "$image" bash -c '
            set -euo pipefail
            echo "container glibc: $(ldd --version | head -1)"
            cat > /tmp/probe.c <<EOF
          #include <dlfcn.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
            void *h = dlopen(argv[1], RTLD_NOW | RTLD_GLOBAL);
            if (!h) { fprintf(stderr, "dlopen failed: %s\n", dlerror()); return 1; }
            printf("dlopen OK: %s\n", argv[1]);
            return 0;
          }
          EOF
            gcc /tmp/probe.c -o /tmp/probe -ldl
            cp /lib-in/libcompat.so /tmp/
            /tmp/probe /tmp/libcompat.so
          '

  package:
    name: Gate, package and install ${{ matrix.package }}
    needs: [plan, notices, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: x86_64-linux
            package: polars-x86_64-linux
            library: libcompat.so
            arch: x64
            catalog-test: ""
          - os: macos-latest
            platform: aarch64-macosx
            package: polars-aarch64-macosx
            library: libcompat.dylib
            arch: arm64
            catalog-test: --full
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: ./.github/actions/install-racket
        with:
          version: ${{ needs.plan.outputs.racket }}
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@v8
        with:
          name: libcompat-${{ matrix.platform }}
          path: ${{ runner.temp }}/libcompat
      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: ${{ runner.temp }}/notices
      - name: Compile polars for the exports gate
        run: |
          listed=$(racket scripts/release/catalog.rkt deps polars)
          mapfile -t deps <<<"$listed"
          raco pkg install --batch --deps search-auto --skip-installed "${deps[@]}"
          PLTCOLLECTS="$PWD:" raco make -j 4 polars/private/*.rkt scripts/check-bindings.rkt
      - name: Gate the binary
        run: scripts/release/gates.sh ${{ matrix.platform }} "$RUNNER_TEMP/libcompat/${{ matrix.library }}"
      - name: Gate tests
        if: ${{ !cancelled() }}
        run: scripts/release/gates-test.sh "$RUNNER_TEMP/libcompat/${{ matrix.library }}"
      - name: Package
        run: >-
          scripts/release/package.sh ${{ matrix.platform }} "$RUNNER_TEMP/libcompat"
          "$RUNNER_TEMP/notices/THIRD-PARTY-NOTICES.txt" "$RUNNER_TEMP/dist"
      - name: Install from a file:// catalog
        run: scripts/release/catalog-test.sh ${{ matrix.platform }} "$RUNNER_TEMP/dist" ${{ matrix.catalog-test }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  pkg-build:
    name: Install with docs and test offline as root, as pkg-build does
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/download-artifact@v8
        with:
          name: polars-x86_64-linux
          path: ${{ runner.temp }}/dist
      - name: pkg-build's image and natipkg Racket
        env:
          RELEASE_CPUS: "4"
          RELEASE_LOGS: ${{ runner.temp }}/pkg-build-logs
        run: scripts/release/pkg-build-test.sh "$RUNNER_TEMP/dist"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pkg-build-logs
          path: ${{ runner.temp }}/pkg-build-logs

  # The packages on the newest Racket and runner images, which the catalog
  # moves to; the draft does not wait for it.
  forward-compat:
    name: Install ${{ matrix.package }} on Racket stable
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: x86_64-linux
            package: polars-x86_64-linux
            arch: x64
          - os: macos-latest
            platform: aarch64-macosx
            package: polars-aarch64-macosx
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: ./.github/actions/install-racket
        with:
          version: stable
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.package }}
          path: ${{ runner.temp }}/dist
      - name: Install from a file:// catalog
        run: scripts/release/catalog-test.sh ${{ matrix.platform }} "$RUNNER_TEMP/dist" --full

  draft:
    name: Draft the GitHub Release
    if: needs.plan.outputs.tag != ''
    needs: [plan, package, old-glibc-load, pkg-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/download-artifact@v8
        with:
          pattern: polars-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: scripts/release/draft.sh "$TAG" "$SHA" "$RUNNER_TEMP/dist"
