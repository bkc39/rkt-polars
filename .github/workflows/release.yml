# A tag v<native-version> builds, gates, packages and tests both native
# packages and drafts their GitHub Release; any other run, a PR's included,
# does all of it but the draft (polars/native-libs/BUILDING.md).
name: Release build

on:
  pull_request:
    paths:
      - rust/**
      - native/**
      - polars/info.rkt
      - scripts/release/**
      - scripts/build-so.sh
      - scripts/stage-native-package.rkt
      - .github/workflows/release.yml
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A PR's head, not the merge with its base, so the manifest's commit is one
# that exists after the run.
env:
  CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: The native release a tag drafts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - id: plan
        name: Draft only for v<native-version>
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/release/draft-tag.sh "$TAG" >>"$GITHUB_OUTPUT"

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: cargo-about, at flake.lock's nixpkgs
        run: scripts/release/notices.sh "$RUNNER_TEMP/notices/THIRD-PARTY-NOTICES.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: ${{ runner.temp }}/notices
          if-no-files-found: error

  build:
    name: Build libcompat (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: x86_64-linux
            target: linux
          - os: macos-latest
            platform: aarch64-macosx
            target: darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Cache cargo build
        if: matrix.target == 'darwin'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build shared object
        run: scripts/build-so.sh ${{ matrix.target }}
      - name: Record the rust/ tree and commit built
        run: |
          git rev-parse HEAD:rust > polars/native-libs/candidates/${{ matrix.target }}/rust-tree
          git rev-parse HEAD > polars/native-libs/candidates/${{ matrix.target }}/commit
      - uses: actions/upload-artifact@v7
        with:
          name: libcompat-${{ matrix.platform }}
          path: polars/native-libs/candidates/${{ matrix.target }}/
          if-no-files-found: error

  package:
    name: Gate, package and install ${{ matrix.package }}
    needs: [plan, notices, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: x86_64-linux
            package: polars-x86_64-linux
            library: libcompat.so
            arch: x64
            catalog-test: ""
          # No pkg-build test on macOS, so its catalog test renders the docs
          # and runs the suite.
          - os: macos-latest
            platform: aarch64-macosx
            package: polars-aarch64-macosx
            library: libcompat.dylib
            arch: arm64
            catalog-test: --full
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: ./.github/actions/install-racket
        with:
          version: "9.3"
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@v8
        with:
          name: libcompat-${{ matrix.platform }}
          path: ${{ runner.temp }}/libcompat
      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: ${{ runner.temp }}/notices
      - name: Compile polars for the exports gate
        run: |
          raco pkg install --batch --auto --skip-installed gregor-lib threading-lib
          PLTCOLLECTS="$PWD:" raco make -j 4 polars/private/*.rkt scripts/check-bindings.rkt
      - name: Gate the binary
        run: scripts/release/gates.sh ${{ matrix.platform }} "$RUNNER_TEMP/libcompat/${{ matrix.library }}"
      - name: Gate tests
        if: ${{ !cancelled() }}
        run: scripts/release/gates-test.sh "$RUNNER_TEMP/libcompat/${{ matrix.library }}"
      - name: Package
        run: >-
          scripts/release/package.sh ${{ matrix.platform }} "$RUNNER_TEMP/libcompat"
          "$RUNNER_TEMP/notices/THIRD-PARTY-NOTICES.txt" "$RUNNER_TEMP/dist"
      - name: Install from a file:// catalog
        run: scripts/release/catalog-test.sh ${{ matrix.platform }} "$RUNNER_TEMP/dist" ${{ matrix.catalog-test }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  pkg-build:
    name: Install with docs and test offline as root, as pkg-build does
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/download-artifact@v8
        with:
          name: polars-x86_64-linux
          path: ${{ runner.temp }}/dist
      - name: pkg-build's image and natipkg Racket
        env:
          RELEASE_CPUS: "4"
          RELEASE_LOGS: ${{ runner.temp }}/pkg-build-logs
        run: scripts/release/pkg-build-test.sh "$RUNNER_TEMP/dist"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pkg-build-logs
          path: ${{ runner.temp }}/pkg-build-logs

  draft:
    name: Draft the GitHub Release
    if: needs.plan.outputs.tag != ''
    needs: [plan, package, pkg-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: polars-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: >-
          gh release create "$TAG" --draft --verify-tag
          --title "$TAG"
          --notes "Native packages polars-x86_64-linux and polars-aarch64-macosx $TAG, their catalog entries, manifests and checksums"
          "$RUNNER_TEMP"/dist/*
