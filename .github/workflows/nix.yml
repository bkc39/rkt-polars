# Reusable workflow: invoked by ci.yml, so the CI run (and its badge) is
# green only when these checks pass.
on: workflow_call
name: Nix

jobs:
  flake-check:
    name: Nix Flake Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Configure Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Run flake checks
        run: nix flake check --print-build-logs

  racket-pre-release:
    name: Racket pre-release tests
    needs: flake-check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Configure Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Fetch libcompat
        run: nix build .#rust --max-jobs 0 --out-link "$RUNNER_TEMP/libcompat"

      - name: Install Racket pre-release
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: pre-release

      - name: Install rkt-polars
        env:
          RKT_POLARS_COMPAT_LIB_PATH: ${{ runner.temp }}/libcompat
        run: |
          racket -e '(displayln (version))'
          raco pkg install --batch --auto --no-docs --name rkt-polars --link "$PWD"

      - name: Test
        env:
          RKT_POLARS_COMPAT_LIB_PATH: ${{ runner.temp }}/libcompat
        run: raco test -e --timeout 600 -c polars

  lint:
    name: Lint (no-syntax-rule, no-inline-tests, rustls-only, no-dynamic-wind, resyntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Also a flake check; run first here for a fast, annotated failure.
      - name: No define-syntax-rule
        run: scripts/no-syntax-rule.sh

      - name: No inline tests under polars/private
        if: ${{ !cancelled() }}
        run: scripts/no-inline-tests.sh

      - name: TLS is rustls only
        if: ${{ !cancelled() }}
        run: scripts/rustls-only.sh

      - name: No dynamic-wind outside resource.rkt
        if: ${{ !cancelled() }}
        run: scripts/no-dynamic-wind.sh

      - name: The catalog install copies only the dependencies' catalogs
        if: ${{ !cancelled() }}
        run: scripts/dependency-catalogs-test.sh

      - name: Install Nix
        if: ${{ !cancelled() }}
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Configure Nix Cache
        if: ${{ !cancelled() }}
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Staging a native package
        if: ${{ !cancelled() }}
        run: nix develop --command bash scripts/stage-native-package-test.sh

      - name: Release gates against planted libraries
        if: ${{ !cancelled() }}
        run: nix develop --command bash scripts/release/gates-test.sh polars/native-libs

      - name: Resyntax suite tests
        if: ${{ !cancelled() }}
        run: nix develop --command raco test lint

      - name: Resyntax
        if: ${{ !cancelled() }}
        run: nix develop --command scripts/resyntax-lint.sh
